<!doctype html><html lang="pt-AO"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#020402"><title>CrisJoseGamers</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020402;font-family:Arial,Helvetica,sans-serif}#app{position:fixed;inset:0;background:#020402}video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#020402}.vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle,transparent 35%,rgba(0,0,0,.45) 100%)}.screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .8s ease;background:radial-gradient(circle at 50% 38%,rgba(89,255,0,.18),transparent 25%),radial-gradient(circle at 50% 65%,rgba(24,110,12,.12),transparent 42%),#020402}.screen.show{opacity:1;pointer-events:auto}.panel{width:min(92vw,520px);text-align:center;padding:28px 20px}.logo{width:min(62vw,285px);aspect-ratio:1;object-fit:cover;border-radius:50%;border:3px solid #59ff00;box-shadow:0 0 12px #59ff00,0 0 45px rgba(89,255,0,.32);animation:float 3.2s ease-in-out infinite}.title{margin:25px 0 7px;color:#fff;font-size:clamp(25px,7vw,39px);font-weight:900;line-height:1.08;text-shadow:0 0 15px rgba(89,255,0,.2)}.title span{color:#59ff00}.sub{margin:0 0 27px;color:#d2d2d2;font-size:clamp(14px,4vw,18px)}.sub b{color:#59ff00}.enter{position:relative;overflow:hidden;border:1px solid #9aff70;background:#59ff00;color:#071000;font-size:17px;font-weight:900;padding:15px 45px;border-radius:15px;min-width:220px;cursor:pointer;box-shadow:0 0 16px #59ff00,0 0 42px rgba(89,255,0,.3);animation:pulse 1.8s ease-in-out infinite}.enter:before{content:"";position:absolute;top:0;left:-70%;width:45%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.75),transparent);transform:skewX(-20deg);animation:shine 2.5s infinite}.enter span{position:relative;z-index:1}.sound{margin-top:14px;color:#888;font-size:12px}.start{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:#020402}.start button{border:1px solid #9aff70;background:#59ff00;color:#071000;border-radius:14px;padding:15px 30px;font-weight:900;font-size:16px;box-shadow:0 0 30px rgba(89,255,0,.4)}.start small{display:block;color:#888;margin-top:10px;text-align:center}.hidden{opacity:0;pointer-events:none;transition:opacity .5s}.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}.flash.go{animation:flash .55s ease}@keyframes float{50%{transform:translateY(-8px)}}@keyframes pulse{50%{box-shadow:0 0 26px #59ff00,0 0 60px rgba(89,255,0,.38)}}@keyframes shine{0%{left:-70%}55%,100%{left:125%}}@keyframes flash{0%{opacity:0}25%{opacity:.7}100%{opacity:0}}</style></head><body><div id="app"><video id="intro" playsinline preload="auto"><source src="assets/intro.mp4" type="video/mp4"></video><div class="vignette"></div><div class="start" id="start"><div><button id="startBtn">▶ INICIAR</button><small>Toque para iniciar o intro</small></div></div><section class="screen" id="entry"><div class="panel"><img class="logo" src="assets/logo.png" alt="CrisJoseGamers"><h1 class="title">Seja bem-vindo à<br><span>CrisJose Gamers!</span></h1><p class="sub"><b>Gerenciamento de máquinas</b></p><button class="enter" id="enter"><span>ENTRAR</span></button><div class="sound">🔊 Mensagem de boas-vindas + efeito de entrada</div></div></section><div class="flash" id="flash"></div></div><script>const video=document.getElementById('intro'),start=document.getElementById('start'),startBtn=document.getElementById('startBtn'),entry=document.getElementById('entry'),enter=document.getElementById('enter'),flash=document.getElementById('flash');function beginIntro(){start.classList.add('hidden');video.currentTime=0;video.muted=false;const p=video.play();if(p)p.catch(()=>{video.muted=true;video.play()})}startBtn.addEventListener('click',beginIntro);video.addEventListener('ended',()=>entry.classList.add('show'));enter.addEventListener('click',()=>{flash.classList.remove('go');void flash.offsetWidth;flash.classList.add('go');setTimeout(()=>{window.location.href='login.html'},430)})</script></body></html>
