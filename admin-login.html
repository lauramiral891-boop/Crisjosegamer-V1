<!doctype html><html lang="pt-AO"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#020605"><title>CrisJoseGamers · Acesso ADM</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 15%,rgba(40,255,120,.18),transparent 28%),#020605;color:#f4fff7;font-family:system-ui,-apple-system,Segoe UI,Arial}.wrap{min-height:100vh;display:grid;place-items:center;padding:20px}.box{width:min(94vw,430px);padding:28px;border:1px solid rgba(50,255,125,.28);border-radius:28px;background:linear-gradient(145deg,rgba(7,30,18,.96),rgba(2,10,6,.98));box-shadow:0 0 70px rgba(30,255,110,.08);position:relative;overflow:hidden}.box:before{content:"";position:absolute;inset:-40%;background:conic-gradient(from 0deg,transparent 0 70%,rgba(55,255,120,.22) 78%,transparent 86%);animation:spin 7s linear infinite}.inside{position:relative;z-index:1}.logo{width:105px;height:105px;border-radius:50%;display:block;margin:0 auto 18px;border:2px solid #28ff7d;box-shadow:0 0 28px rgba(40,255,125,.35)}h1{text-align:center;margin:0;font-size:25px}p{text-align:center;color:#789486;font-size:11px}.badge{display:block;width:max-content;margin:10px auto 20px;padding:6px 10px;border:1px solid #286a44;border-radius:99px;color:#75ffad;font-size:9px}.field{width:100%;padding:13px;margin:6px 0;border:1px solid #194a31;background:#04100a;color:#fff;border-radius:11px;outline:none}.field:focus{border-color:#29ff7d;box-shadow:0 0 0 3px rgba(41,255,125,.08)}button{width:100%;padding:13px;border-radius:12px;border:1px solid #2aff7e;background:#24f675;color:#031007;font-weight:900;cursor:pointer;margin-top:9px}.back{background:#06140d;color:#a7cbb6;border-color:#1b5135}.error{display:none;margin-top:10px;padding:10px;border:1px solid #693434;background:#1d0b0b;color:#ffb0b0;border-radius:10px;font-size:10px}.error.show{display:block}.note{margin-top:14px;text-align:center;color:#53685d;font-size:9px}@keyframes spin{to{transform:rotate(360deg)}}</style></head><body><div class="wrap"><div class="box"><div class="inside"><img class="logo" src="assets/logo.png" alt="CrisJoseGamers"><h1>Acesso reservado</h1><p>Sala única do Administrador CrisJoseGamers</p><span class="badge">ADM · ACESSO RESTRITO</span><input id="user" class="field" autocomplete="username" placeholder="Nome de usuário do ADM"><input id="pass" class="field" type="password" autocomplete="current-password" placeholder="Senha do ADM"><button id="enter">ENTRAR NA SALA DO ADM</button><button class="back" id="back">Voltar para o login</button><div class="error" id="error">Usuário ou senha incorretos.</div><div class="note">Protótipo local: no Firebase, esta conta será protegida por autenticação real e regras de acesso.</div></div></div></div><script>const ADMIN_USER='CJG-ADM';const ADMIN_PASS='Cjg@Admin2026!';function go(){const u=document.getElementById('user').value.trim(),p=document.getElementById('pass').value;if(u===ADMIN_USER&&p===ADMIN_PASS){localStorage.setItem('cjgAdminSession','active');localStorage.setItem('cjgAdminUser',u);location.href='admin.html'}else document.getElementById('error').classList.add('show')}document.getElementById('enter').onclick=go;document.getElementById('pass').addEventListener('keydown',e=>{if(e.key==='Enter')go()});document.getElementById('back').onclick=()=>location.href='login.html';</script></body></html>
