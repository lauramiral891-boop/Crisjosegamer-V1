services:
  - type: web
    name: crisjosegamers-api
    runtime: node
    plan: free
    rootDir: CrisJoseGamers_Completo_v10/servidor
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: crisjosegamers-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: crisjosegamers-db
    plan: free
    region: virginia
    databaseName: crisjosegamers
    user: crisjosegamers
